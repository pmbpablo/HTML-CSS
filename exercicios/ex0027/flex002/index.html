<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .conteiner{
            background-color: lightsalmon;
            display: flex;
            /*
            flex-direction: row; linha da esquerda para a direita 
            flex-direction: row-reverse; linha da direita para a esquerda
            flex-direction: column; coluna de cima para baixo
            flex-direction: column-reverse; coluna de baixo para cima
            */
            /*
            EIXOS (axis)

            main= a ordem que os objetos vão aparecer, sendo o inicio start e o fim end.
            cross= a ordem que a nova linha/coluna vai ser criada sendo o inicio start e o fim end.
            */
        }
        .item{
            background-color: aquamarine;
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
    </div>
</body>
</html>
