<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .conteiner{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;

        }
        .item{
            background-color: aquamarine;
            border: 1px solid black;
            padding: 20px;
        }
          #i1{
            
          }
          #i2{
          
          }
          #i3{
              align-self: flex-end;
          }
          #i4{
          
          }
          #i5{
            align-self: center;
          }
          #i6{
            
          }
          #i7{
            align-items: stretch;
          }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">1</div>
        <div class="item" id="i2">2</div>
        <div class="item" id="i3">3</div>
        <div class="item" id="i4">4</div>
        <div class="item" id="i5">5</div>
        <div class="item" id="i6">6</div>
        <div class="item" id="i7">7</div>
    </div>
</body>
</html>
