<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LInks</title>
    <style>
        a{
            color: red;
            text-decoration: none;
        }
        a:active{
            color: green;
        }
        a:visited{
            color: yellow;

        }
        a::after{
            content: '[LINK]';
            color: blue;
        }
    </style>
</head>
<body>
    <p><a href="https://www.youtube.com/coisadenerd" target="_blank">Clique aqui</a></p>
    <p>oi</p>
    <p>Lorem ipsum dolor sit amet consectetur <a href="#">adipisicing</a> elit. Voluptas illo nemo delectus ipsam, <a href="https://www.youtube.com/cadeachave" target="_blank">distinctio</a> exercitationem odio, ducimus veniam ipsa nobis inventore facilis corrupti necessitatibus, asperiores veritatis molestias amet laboriosam iste!</p>
    
</body>
</html>
